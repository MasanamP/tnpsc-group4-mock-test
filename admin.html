
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TNPSC Group 4 Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#f1f5f9;margin:0;padding:20px;color:#172554}
main{max-width:850px;margin:auto}
section{background:white;padding:20px;margin:16px 0;border-radius:12px;box-shadow:0 2px 8px #ddd}
input,select,textarea{box-sizing:border-box;width:100%;padding:10px;margin:6px 0 12px;border:1px solid #bbb;border-radius:5px}
textarea{min-height:65px}
button{padding:11px 16px;background:#1756a9;color:white;border:0;border-radius:5px;cursor:pointer;margin:5px 0}
.hidden{display:none!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#msg{overflow-wrap:anywhere}.item{padding:12px;border-bottom:1px solid #ddd}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<h1>TNPSC Group 4 — Admin Panel</h1>
<section id="connect">
<h2>Supabase Connection</h2>
<label>Project URL</label>
<input id="url" value="https://ghxdslzwiizjreuosuia.supabase.co">
<label>Publishable Key</label>
<input id="key" type="password" placeholder="Paste your Supabase publishable key">
<button onclick="connectDB()">Connect</button>
</section>
<section id="login">
<h2>Admin Login</h2>
<label>Email</label><input id="email" type="email" required>
<label>Password</label><input id="password" type="password" required>
<button onclick="loginAdmin()">Login</button>
</section>
<div id="panel" class="hidden">
<section>
<h2>Welcome, Admin!</h2>
<p id="who"></p><button onclick="logout()">Logout</button>
</section>
<section>
<h2>1. Create Test / தேர்வு உருவாக்கவும்</h2>
<label>Test Title (English) *</label><input id="title" placeholder="TNPSC Group 4 Mock Test 1">
<label>Test Title (Tamil)</label><input id="titleTa" placeholder="குரூப் 4 மாதிரி தேர்வு 1">
<div class="grid">
<div><label>Duration (minutes)</label><input id="duration" type="number" value="90" min="1"></div>
<div><label>Status</label><select id="testStatus"><option value="draft">Draft</option><option value="published">Published</option></select></div>
</div>
<button onclick="createTest()">Create Test</button>
</section>
<section>
<h2>2. Add Questions / கேள்விகள் சேர்க்கவும்</h2>
<label>Select Test</label><select id="testSelect"><option value="">Create a test first</option></select>
<label>Question (English) *</label><textarea id="qEn"></textarea>
<label>Question (Tamil)</label><textarea id="qTa"></textarea>
<div class="grid">
<div><label>Option A (English) *</label><input id="aEn"></div>
<div><label>Option A (Tamil)</label><input id="aTa"></div>
<div><label>Option B (English) *</label><input id="bEn"></div>
<div><label>Option B (Tamil)</label><input id="bTa"></div>
<div><label>Option C (English) *</label><input id="cEn"></div>
<div><label>Option C (Tamil)</label><input id="cTa"></div>
<div><label>Option D (English) *</label><input id="dEn"></div>
<div><label>Option D (Tamil)</label><input id="dTa"></div>
</div>
<div class="grid">
<div><label>Correct Answer</label><select id="correct"><option>A</option><option>B</option><option>C</option><option>D</option></select></div>
<div><label>Question Number</label><input id="qOrder" type="number" min="1" value="1"></div>
</div>
<label>Explanation (English)</label><textarea id="expEn"></textarea>
<label>விளக்கம் (Tamil)</label><textarea id="expTa"></textarea>
<button onclick="saveQuestion()">Save Question</button>
<button onclick="clearQuestion()">Clear Form</button>
</section>
<section>
<h2>3. Existing Tests</h2>
<button onclick="loadTests()">Refresh Tests</button>
<div id="testList"></div>
</section>
</div>
<p id="msg">Connect to Supabase to begin.</p>
</main>
<script>
let db=null,user=null;
const el=id=>document.getElementById(id);
function message(t){el("msg").textContent=t;}
function connectDB(){
 const url=el("url").value.trim(),key=el("key").value.trim();
 if(!url||!key){message("Enter Project URL and publishable key.");return;}
 try{db=supabase.createClient(url,key);message("Connected. Please login.");}
 catch(e){message("Connection error: "+e.message);}
}
async function loginAdmin(){
 if(!db){message("Click Connect first.");return;}
 const {data,error}=await db.auth.signInWithPassword({
  email:el("email").value.trim(),password:el("password").value
 });
 if(error){message("Login failed: "+error.message);return;}
 user=data.user;
 const r=await db.from("admin_users").select("user_id").eq("user_id",user.id).maybeSingle();
 if(r.error||!r.data){
  await db.auth.signOut();user=null;
  message("Admin permission error: "+(r.error?.message||"User not found in admin_users"));return;
 }
 el("login").classList.add("hidden");
 el("connect").classList.add("hidden");
 el("panel").classList.remove("hidden");
 el("who").textContent="Logged in: "+user.email;
 message("Admin login successful.");
 await loadTests();
}
async function logout(){
 if(db)await db.auth.signOut();
 user=null;location.reload();
}
async function createTest(){
 if(!user)return message("Please login first.");
 if(!el("title").value.trim())return message("Enter test title.");
 const payload={
  title:el("title").value.trim(),
  title_ta:el("titleTa").value.trim()||null,
  duration_minutes:Number(el("duration").value),
  status:el("testStatus").value
 };
 const {data,error}=await db.from("tests").insert(payload).select("id").single();
 if(error)return message("Create test failed: "+error.message);
 message("Test created successfully. ID: "+data.id);
 el("title").value="";el("titleTa").value="";
 await loadTests(data.id);
}
async function loadTests(selectedId){
 const {data,error}=await db.from("tests").select("id,title,title_ta,duration_minutes,status").order("id",{ascending:false});
 if(error)return message("Load tests failed: "+error.message);
 const s=el("testSelect"),list=el("testList");s.replaceChildren();list.replaceChildren();
 if(!data.length){s.add(new Option("No tests yet",""));list.textContent="No tests created.";return;}
 data.forEach(t=>{
  s.add(new Option("#"+t.id+" - "+t.title,t.id));
  const d=document.createElement("div");d.className="item";
  d.textContent="#"+t.id+" | "+t.title+" | "+(t.title_ta||"")+" | "+t.duration_minutes+" min | "+t.status+" ";
  const b=document.createElement("button");b.textContent="Select";
  b.onclick=()=>{s.value=t.id;el("qOrder").value="1";message("Selected test #"+t.id);};
  d.appendChild(b);list.appendChild(d);
 });
 if(selectedId)s.value=String(selectedId);
}
async function saveQuestion(){
 if(!user)return message("Please login first.");
 const testId=el("testSelect").value;
 if(!testId)return message("Select a test first.");
 const required=["qEn","aEn","bEn","cEn","dEn"];
 for(const id of required)if(!el(id).value.trim())return message("Fill all required English question and option fields.");
 const payload={
  test_id:Number(testId),question_en:el("qEn").value.trim(),
  question_ta:el("qTa").value.trim()||null,
  option_a_en:el("aEn").value.trim(),option_a_ta:el("aTa").value.trim()||null,
  option_b_en:el("bEn").value.trim(),option_b_ta:el("bTa").value.trim()||null,
  option_c_en:el("cEn").value.trim(),option_c_ta:el("cTa").value.trim()||null,
  option_d_en:el("dEn").value.trim(),option_d_ta:el("dTa").value.trim()||null,
  correct_option:el("correct").value,
  question_order:Number(el("qOrder").value),
  explanation_en:el("expEn").value.trim()||null,
  explanation_ta:el("expTa").value.trim()||null
 };
 const {data,error}=await db.from("questions").insert(payload).select("id,question_order").single();
 if(error)return message("Save question failed: "+error.message);
 message("Question "+data.question_order+" saved successfully.");
 clearQuestion();el("qOrder").value=Number(payload.question_order)+1;
}
function clearQuestion(){
 ["qEn","qTa","aEn","aTa","bEn","bTa","cEn","cTa","dEn","dTa","expEn","expTa"].forEach(id=>el(id).value="");
 el("correct").value="A";
}
</script>
</body>
</html>
