
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TNPSC Group 4 - Student Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;color:#172033;font-family:Arial,sans-serif}
header{background:#123c73;color:white;padding:18px;text-align:center}
main{max-width:900px;margin:22px auto;padding:16px}
.panel{background:white;padding:20px;margin-bottom:18px;border-radius:12px;box-shadow:0 2px 10px #0001}
input{width:100%;padding:12px;margin:7px 0 12px;border:1px solid #cbd5e1;border-radius:7px}
button{padding:11px 15px;margin:5px 4px 5px 0;border:0;border-radius:7px;background:#155eaa;color:white;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.secondary{background:#0f766e}
.muted{color:#64748b}
.test-card{border:1px solid #dbe3ee;border-radius:9px;padding:15px;margin:12px 0}
.option{display:block;background:#f8fafc;border:1px solid #dbe3ee;padding:12px;margin:9px 0;border-radius:7px;cursor:pointer}
.option input{width:auto;margin:0 8px 0 0}
#portal,#exam,#result{display:none}
#message{white-space:pre-wrap;overflow-wrap:anywhere}
#timer{font-size:20px;font-weight:bold;color:#b91c1c}
</style>
</head>

<body>
<header>
  <h1>TNPSC Group 4</h1>
  <p>Online Mock Test Portal / ஆன்லைன் மாதிரி தேர்வு</p>
</header>

<main>
  <section id="login" class="panel">
    <h2>Student Login / மாணவர் உள்நுழைவு</h2>

    <label for="email">Email Address</label>
    <input id="email" type="email" autocomplete="email" placeholder="Enter email">

    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="Enter password">

    <button id="loginBtn">Login</button>
    <button id="signupBtn" class="secondary">Create Account</button>
  </section>

  <section id="portal" class="panel">
    <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center">
      <div>
        <h2>Student Dashboard</h2>
        <p id="studentEmail" class="muted"></p>
      </div>
      <button id="logoutBtn">Logout</button>
    </div>

    <h3>Available Mock Tests</h3>
    <p class="muted">Published tests மட்டும் இங்கு காட்டப்படும்.</p>
    <button id="refreshBtn" class="secondary">Refresh Tests</button>
    <div id="testsList"></div>
  </section>

  <section id="exam" class="panel">
    <button id="backBtn">← Back to Tests</button>
    <h2 id="examTitle"></h2>
    <p id="progress"></p>
    <p id="timer">Time: --:--</p>
    <div id="questionArea"></div>

    <div>
      <button id="previousBtn">Previous</button>
      <button id="nextBtn" class="secondary">Next</button>
      <button id="submitBtn">Submit Test</button>
    </div>
  </section>

  <section id="result" class="panel">
    <h2>Test Result / தேர்வு முடிவு</h2>
    <p id="score" style="white-space:pre-wrap"></p>
    <button id="resultBackBtn">Back to Tests</button>
  </section>

  <section class="panel">
    <p id="message" role="status" aria-live="polite"></p>
  </section>
</main>

<script>
"use strict";

// Supabase project settings
const SUPABASE_URL = "https://ghxdslzwiizjreuosuia.supabase.co";

// Use your current Supabase Publishable Key.
// Never put a service_role or secret key in this file.
const SUPABASE_KEY = "sb_publishable__tKJU7MQ22Za4EJY2q4JLA_i692m4jo";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const $ = id => document.getElementById(id);

let currentUser = null;
let currentTest = null;
let questions = [];
let answers = {};
let questionIndex = 0;
let timerHandle = null;
let endTime = 0;
let submitted = false;
let submitting = false;

function message(text, error = false) {
  $("message").textContent = text || "";
  $("message").style.color = error ? "#b91c1c" : "#166534";
}

function showOnly(section) {
  ["login", "portal", "exam", "result"].forEach(id => {
    $(id).style.display = id === section ? "block" : "none";
  });
}

function safeText(tag, text) {
  const element = document.createElement(tag);
  element.textContent = text ?? "";
  return element;
}

async function loadTests() {
  $("testsList").replaceChildren(
    safeText("p", "Loading tests...")
  );
  message("");

  const { data, error } = await db
    .from("tests")
    .select("id,title,title_ta,duration_minutes,status")
    .eq("status", "published")
    .order("id", { ascending: false });

  if (error) {
    $("testsList").replaceChildren();
    message("Could not load tests: " + error.message, true);
    return;
  }

  $("testsList").replaceChildren();

  if (!data || data.length === 0) {
    $("testsList").append(
      safeText("p", "No published tests available yet.")
    );
    return;
  }

  data.forEach(test => {
    const card = document.createElement("div");
    card.className = "test-card";

    card.append(
      safeText("h3", test.title || "TNPSC Group 4 Mock Test")
    );

    if (test.title_ta) {
      card.append(safeText("p", test.title_ta));
    }

    card.append(
      safeText(
        "p",
        "Duration: " + (Number(test.duration_minutes) || 15) + " minutes"
      )
    );

    const button = safeText("button", "Start Test");
    button.addEventListener("click", () => startTest(test));
    card.append(button);

    $("testsList").append(card);
  });
}

async function startTest(test) {
  if (!currentUser) {
    message("Please login before starting a test.", true);
    showOnly("login");
    return;
  }

  clearInterval(timerHandle);
  submitted = false;
  submitting = false;
  $("submitBtn").disabled = false;
  $("submitBtn").textContent = "Submit Test";
  message("Loading questions...");

  const { data, error } = await db
    .from("questions")
    .select(
      "id,test_id,question_en,question_ta," +
      "option_a_en,option_b_en,option_c_en,option_d_en," +
      "option_a_ta,option_b_ta,option_c_ta,option_d_ta"
    )
    .eq("test_id", test.id)
    .order("id", { ascending: true });

  if (error) {
    message("Could not load questions: " + error.message, true);
    return;
  }

  if (!data || data.length === 0) {
    message(
      "இந்த test-ல் questions இல்லை. Admin Panel-ல் questions சேர்க்கவும்.",
      true
    );
    return;
  }

  currentTest = test;
  questions = data;
  answers = {};
  questionIndex = 0;

  $("examTitle").textContent =
    test.title || "TNPSC Group 4 Mock Test";

  $("result").style.display = "none";
  showOnly("exam");
  message("");

  const durationMinutes = Math.max(
    1,
    Number(test.duration_minutes) || 15
  );

  endTime = Date.now() + durationMinutes * 60 * 1000;

  updateTimer();
  timerHandle = setInterval(updateTimer, 1000);

  renderQuestion();
}

function updateTimer() {
  if (submitted || submitting || !currentTest) return;

  const seconds = Math.max(
    0,
    Math.ceil((endTime - Date.now()) / 1000)
  );

  const minutes = Math.floor(seconds / 60);
  const remainder = seconds % 60;

  $("timer").textContent =
    "Time: " +
    String(minutes).padStart(2, "0") + ":" +
    String(remainder).padStart(2, "0");

  if (seconds <= 0) {
    clearInterval(timerHandle);
    finishTest(true);
  }
}

function renderQuestion() {
  const q = questions[questionIndex];
  if (!q) return;

  $("progress").textContent =
    "Question " + (questionIndex + 1) +
    " of " + questions.length;

  const area = $("questionArea");
  area.replaceChildren();

  area.append(
    safeText(
      "h3",
      (questionIndex + 1) + ". " + (q.question_en || "")
    )
  );

  if (q.question_ta) {
    area.append(safeText("p", q.question_ta));
  }

  const options = [
    ["A", q.option_a_en, q.option_a_ta],
    ["B", q.option_b_en, q.option_b_ta],
    ["C", q.option_c_en, q.option_c_ta],
    ["D", q.option_d_en, q.option_d_ta]
  ];

  options.forEach(([key, english, tamil]) => {
    const label = document.createElement("label");
    label.className = "option";

    const radio = document.createElement("input");
    radio.type = "radio";
    radio.name = "answer";
    radio.value = key;
    radio.checked = answers[q.id] === key;
    radio.addEventListener("change", () => {
      answers[q.id] = key;
    });

    label.append(
      radio,
      document.createTextNode(key + ". " + (english || ""))
    );

    if (tamil) {
      label.append(document.createElement("br"));
      label.append(document.createTextNode(tamil));
    }

    area.append(label);
  });

  $("previousBtn").disabled = questionIndex === 0;
  $("nextBtn").disabled = questionIndex === questions.length - 1;
}

$("nextBtn").addEventListener("click", () => {
  if (questionIndex < questions.length - 1) {
    questionIndex++;
    renderQuestion();
  }
});

$("previousBtn").addEventListener("click", () => {
  if (questionIndex > 0) {
    questionIndex--;
    renderQuestion();
  }
});

$("submitBtn").addEventListener("click", () => {
  if (submitted || submitting) return;

  if (confirm("Submit this test now?")) {
    finishTest(false);
  }
});

// Send answers to the Supabase Edge Function.
// Scoring must be performed by the server, not this browser.
async function finishTest(autoSubmit) {
  if (submitted || submitting) return;

  if (!currentTest || !questions.length) {
    message("No active test found.", true);
    return;
  }

  submitting = true;
  clearInterval(timerHandle);
  $("submitBtn").disabled = true;
  $("submitBtn").textContent = "Submitting...";
  message(
    autoSubmit
      ? "Time is over. Submitting your answers..."
      : "Submitting test and saving result..."
  );

  try {
    const { data, error } = await db.functions.invoke("submit-test", {
      body: {
        test_id: currentTest.id,
        answers: questions.map(q => ({
          question_id: q.id,
          selected_option: answers[q.id] || null
        }))
      }
    });

    if (error) {
      let details = error.message || "Unknown error";

      if (error.context) {
        try {
          const response = await error.context.json();
          details =
            response.message ||
            response.error ||
            details;
        } catch (_) {}
      }

      throw new Error(details);
    }

    if (!data || data.error) {
      throw new Error(data?.error || "No result received.");
    }

    submitted = true;
    submitting = false;

    showOnly("result");

    $("score").textContent =
      "Test submitted successfully!\n" +
      "Score: " + data.score + " / " + data.total_questions + "\n" +
      "Correct: " + data.correct_answers + "\n" +
      "Wrong: " + data.wrong_answers + "\n" +
      "Unanswered: " + data.unanswered;

    message("Your test result has been saved successfully.");

  } catch (e) {
    submitting = false;
    submitted = false;

    $("submitBtn").disabled = false;
    $("submitBtn").textContent = "Submit Test";
    showOnly("exam");

    message(
      "Result could not be saved: " +
      (e.message || "Unknown error") +
      "\nPlease check your connection and try again.",
      true
    );
  }
}

function backToTests() {
  clearInterval(timerHandle);

  currentTest = null;
  questions = [];
  answers = {};
  questionIndex = 0;
  submitted = false;
  submitting = false;

  $("submitBtn").disabled = false;
  $("submitBtn").textContent = "Submit Test";

  showOnly("portal");
  loadTests();
}

$("backBtn").addEventListener("click", () => {
  if (confirm("Exit this test? Your current answers will be lost.")) {
    backToTests();
  }
});

$("resultBackBtn").addEventListener("click", backToTests);
$("refreshBtn").addEventListener("click", loadTests);

$("loginBtn").addEventListener("click", async () => {
  try {
    const email = $("email").value.trim();
    const password = $("password").value;

    if (!email || !password) {
      throw new Error("Enter email and password.");
    }

    const { data, error } = await db.auth.signInWithPassword({
      email,
      password
    });

    if (error) throw error;

    await initSession(data.session);

  } catch (e) {
    message(e.message || "Login failed.", true);
  }
});

$("signupBtn").addEventListener("click", async () => {
  try {
    const email = $("email").value.trim();
    const password = $("password").value;

    if (!email || !password) {
      throw new Error("Enter email and password.");
    }

    if (password.length < 6) {
      throw new Error("Password must be at least 6 characters.");
    }

    const { data, error } = await db.auth.signUp({
      email,
      password
    });

    if (error) throw error;

    if (data.session) {
      await initSession(data.session);
    } else {
      message("Account created. Confirm your email, then log in.");
    }

  } catch (e) {
    message(e.message || "Account creation failed.", true);
  }
});

$("logoutBtn").addEventListener("click", async () => {
  clearInterval(timerHandle);

  const { error } = await db.auth.signOut();

  if (error) {
    message(error.message, true);
    return;
  }

  currentUser = null;
  currentTest = null;
  questions = [];
  answers = {};
  submitted = false;
  submitting = false;

  showOnly("login");
  message("Logged out.");
});

async function initSession(session) {
  if (!session || !session.user) {
    currentUser = null;
    showOnly("login");
    return;
  }

  currentUser = session.user;
  $("studentEmail").textContent = currentUser.email || "Student";

  showOnly("portal");
  await loadTests();
}

db.auth.onAuthStateChange((event, session) => {
  if (event === "SIGNED_OUT") {
    currentUser = null;
    clearInterval(timerHandle);
    showOnly("login");
  }
});

(async function init() {
  const { data, error } = await db.auth.getSession();

  if (error) {
    message(error.message, true);
    showOnly("login");
    return;
  }

  if (data.session) {
    await initSession(data.session);
  } else {
    showOnly("login");
  }
})();
</script>
</body>
</html>
