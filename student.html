
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TNPSC Group 4 - Student Login</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }
    .container {
      max-width: 420px;
      margin: 30px auto;
      padding: 25px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 5px 20px #0001;
    }
    h1 { text-align: center; color: #123c73; }
    h2 { text-align: center; font-size: 20px; }
    label { display: block; margin-top: 15px; font-weight: bold; }
    input {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 14px;
      border: 0;
      border-radius: 7px;
      background: #155eaa;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    .secondary { background: #0f766e; }
    .logout { background: #64748b; }
    #message { line-height: 1.5; overflow-wrap: anywhere; }
    #dashboard { display: none; text-align: center; }
    .note { font-size: 13px; color: #64748b; line-height: 1.5; }
  </style>
</head>
<body>
  <main class="container">
    <h1>TNPSC Group 4</h1>
    <h2>Student Login / மாணவர் உள்நுழைவு</h2>

    <section id="loginForm">
      <label for="email">Email Address / மின்னஞ்சல்</label>
      <input id="email" type="email" placeholder="Enter your email"
             autocomplete="email">

      <label for="password">Password / கடவுச்சொல்</label>
      <input id="password" type="password" placeholder="Enter password"
             autocomplete="current-password">

      <button id="signupBtn" type="button">Create Student Account</button>
      <button id="loginBtn" class="secondary" type="button">
        Login / உள்நுழைவு
      </button>

      <p class="note">
        New student? Create an account first. Use your email address and
        password whenever you log in.
      </p>
    </section>

    <section id="dashboard">
      <h2>Welcome, Student!</h2>
      <p id="studentEmail"></p>
      <p>Login successful.</p>
      <button id="logoutBtn" class="logout" type="button">Logout</button>
    </section>

    <p id="message" role="status" aria-live="polite"></p>
  </main>

  <script>
    const SUPABASE_URL =
      "https://ghxdslzwiizjreuosuia.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable__tKJU7MQ22Za4EJY2q4JLA_i692m4jo";

    const message = document.getElementById("message");
    const loginForm = document.getElementById("loginForm");
    const dashboard = document.getElementById("dashboard");

    function showMessage(text, isError = false) {
      message.textContent = text;
      message.style.color = isError ? "#b91c1c" : "#166534";
    }

    function showDashboard(user) {
      loginForm.style.display = "none";
      dashboard.style.display = "block";
      document.getElementById("studentEmail").textContent =
        user.email || "Student";
      showMessage("Login successful!");
    }

    function showLogin() {
      loginForm.style.display = "block";
      dashboard.style.display = "none";
    }

    let client;

    function getClient() {
      if (!window.supabase) {
        throw new Error(
          "Supabase library failed to load. Check your internet connection."
        );
      }

      if (!client) {
        client = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_KEY
        );
      }
      return client;
    }

    function getCredentials() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        throw new Error("Please enter your email and password.");
      }
      if (password.length < 6) {
        throw new Error("Password must be at least 6 characters.");
      }
      return { email, password };
    }

    document.getElementById("signupBtn").onclick = async () => {
      try {
        showMessage("Creating account...");
        const db = getClient();
        const { email, password } = getCredentials();

        const { data, error } = await db.auth.signUp({
          email,
          password
        });

        if (error) throw error;

        if (data.session && data.user) {
          showDashboard(data.user);
        } else {
          showMessage(
            "Account created. Check your email and confirm your account before logging in."
          );
        }
      } catch (error) {
        showMessage(error.message || "Account creation failed.", true);
      }
    };

    document.getElementById("loginBtn").onclick = async () => {
      try {
        showMessage("Logging in...");
        const db = getClient();
        const { email, password } = getCredentials();

        const { data, error } = await db.auth.signInWithPassword({
          email,
          password
        });

        if (error) throw error;
        showDashboard(data.user);
      } catch (error) {
        showMessage(error.message || "Login failed.", true);
      }
    };

    document.getElementById("logoutBtn").onclick = async () => {
      try {
        const { error } = await getClient().auth.signOut();
        if (error) throw error;

        showLogin();
        showMessage("You have logged out.");
      } catch (error) {
        showMessage(error.message || "Logout failed.", true);
      }
    };

    async function restoreSession() {
      try {
        const { data, error } = await getClient().auth.getSession();
        if (error) throw error;

        if (data.session && data.session.user) {
          showDashboard(data.session.user);
        }
      } catch (error) {
        showMessage(error.message || "Unable to initialize login.", true);
      }
    }

    restoreSession();
  </script>
</body>
</html>
