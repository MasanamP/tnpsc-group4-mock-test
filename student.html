
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TNPSC Group 4 - Student Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 20px;
      color: #172033;
    }
    .card {
      max-width: 420px;
      margin: 45px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 20px #0001;
    }
    h1 { text-align: center; font-size: 25px; }
    label { display: block; margin-top: 16px; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background: #155eef;
      color: white;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }
    .secondary { background: #475569; }
    #message { overflow-wrap: anywhere; line-height: 1.5; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main class="card">
    <h1>TNPSC Group 4</h1>
    <p style="text-align:center">Student Registration & Login</p>

    <section id="authSection">
      <label for="email">Email ID</label>
      <input id="email" type="email"
        placeholder="Enter your email" autocomplete="email">

      <label for="password">Password</label>
      <input id="password" type="password"
        placeholder="Minimum 6 characters"
        autocomplete="current-password">

      <button id="signupButton" type="button">
        Create Student Account
      </button>

      <button id="loginButton" type="button">
        Login
      </button>
    </section>

    <section id="dashboard" class="hidden">
      <h2>Welcome, Student!</h2>
      <p id="studentEmail"></p>
      <p>உங்கள் Login வெற்றிகரமாக முடிந்தது.</p>
      <button id="logoutButton" class="secondary" type="button">
        Logout
      </button>
    </section>

    <p id="message" role="status" aria-live="polite"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL =
      "https://ghxdslzwiizjreuosuia.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable__tKJU7MQ22Za4EJY2q4JLA_i692m4jo";

    const supabase = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const $ = id => document.getElementById(id);

    function message(text, error = false) {
      $("message").textContent = text;
      $("message").style.color = error ? "#b42318" : "#067647";
    }

    function getCredentials() {
      const email = $("email").value.trim();
      const password = $("password").value;

      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        throw new Error("சரியான Email ID உள்ளிடவும்.");
      }

      if (password.length < 6) {
        throw new Error("Password குறைந்தது 6 எழுத்துகள் இருக்க வேண்டும்.");
      }

      return { email, password };
    }

    async function signup() {
      try {
        const { email, password } = getCredentials();

        const { data, error } = await supabase.auth.signUp({
          email,
          password
        });

        if (error) throw error;

        if (data.session) {
          showDashboard(data.user);
          message("Student account உருவாக்கப்பட்டது!");
        } else {
          message(
            "Registration வெற்றி! உங்கள் Email-க்கு வந்த confirmation link-ஐ திறந்து, பின்னர் Login செய்யவும்."
          );
        }
      } catch (error) {
        message(error.message, true);
      }
    }

    async function login() {
      try {
        const { email, password } = getCredentials();

        const { data, error } =
          await supabase.auth.signInWithPassword({
            email,
            password
          });

        if (error) throw error;

        showDashboard(data.user);
        message("Login வெற்றிகரமாக முடிந்தது!");
      } catch (error) {
        message(error.message, true);
      }
    }

    function showDashboard(user) {
      $("authSection").classList.add("hidden");
      $("dashboard").classList.remove("hidden");
      $("studentEmail").textContent =
        "Email: " + (user.email || "");
    }

    async function logout() {
      const { error } = await supabase.auth.signOut();

      if (error) {
        message(error.message, true);
        return;
      }

      $("dashboard").classList.add("hidden");
      $("authSection").classList.remove("hidden");
      $("password").value = "";
      message("நீங்கள் Logout செய்துவிட்டீர்கள்.");
    }

    $("signupButton").addEventListener("click", signup);
    $("loginButton").addEventListener("click", login);
    $("logoutButton").addEventListener("click", logout);

    async function restoreSession() {
      const { data, error } = await supabase.auth.getSession();

      if (error) {
        message(error.message, true);
        return;
      }

      if (data.session) {
        showDashboard(data.session.user);
      }
    }

    restoreSession();
  </script>
</body>
</html>
