
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TNPSC Group 4 - Student Login</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }
    .container {
      max-width: 420px;
      margin: 50px auto;
      padding: 25px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 5px 20px #0001;
    }
    h1 { text-align: center; color: #123c73; font-size: 25px; }
    h2 { text-align: center; font-size: 20px; }
    label { display: block; margin-top: 15px; font-weight: bold; }
    input {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 14px;
      border: 0;
      border-radius: 7px;
      background: #155eaa;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button.secondary { background: #0f766e; }
    button.logout { background: #64748b; }
    #message { margin-top: 15px; line-height: 1.5; overflow-wrap: anywhere; }
    .note { font-size: 13px; color: #64748b; line-height: 1.5; }
    #dashboard { display: none; text-align: center; }
  </style>
</head>
<body>
  <main class="container">
    <h1>TNPSC Group 4</h1>
    <h2>Student Login / மாணவர் உள்நுழைவு</h2>

    <section id="loginForm">
      <label for="email">Email Address / மின்னஞ்சல்</label>
      <input id="email" type="email" placeholder="Enter your email" autocomplete="email">

      <label for="password">Password / கடவுச்சொல்</label>
      <input id="password" type="password" placeholder="Minimum 6 characters"
             autocomplete="current-password">

      <button id="signupBtn" type="button">Create Student Account</button>
      <button id="loginBtn" class="secondary" type="button">Login / உள்நுழைவு</button>

      <p class="note">
        New student? Create an account first. Use your email address and password
        whenever you log in.
      </p>
    </section>

    <section id="dashboard">
      <h2>Welcome, Student!</h2>
      <p id="studentEmail"></p>
      <p>You are logged in successfully.</p>
      <button id="logoutBtn" class="logout" type="button">Logout</button>
    </section>

    <p id="message" role="status" aria-live="polite"></p>
  </main>

  <script>
    const SUPABASE_URL = "https://ghxdslzwiizjreuosuia.supabase.co";
    const SUPABASE_KEY = "PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY_HERE";

    const message = document.getElementById("message");
    const loginForm = document.getElementById("loginForm");
    const dashboard = document.getElementById("dashboard");

    let supabaseClient = null;

    function showMessage(text, isError = false) {
      message.textContent = text;
      message.style.color = isError ? "#b91c1c" : "#166534";
    }

    function setLoggedIn(user) {
      loginForm.style.display = "none";
      dashboard.style.display = "block";
      document.getElementById("studentEmail").textContent =
        user.email || "Student";
      showMessage("Login successful!");
    }

    function setLoggedOut() {
      loginForm.style.display = "block";
      dashboard.style.display = "none";
    }

    function getClient() {
      if (!window.supabase) {
        throw new Error("Supabase library could not load. Check your internet connection.");
      }

      if (!SUPABASE_KEY ||
          SUPABASE_KEY === "PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY_HERE") {
        throw new Error("Please add your Supabase publishable key in student.html.");
      }

      if (!supabaseClient) {
        supabaseClient = window.supabase.createClient(
          SUPABASE_URL, SUPABASE_KEY
        );
      }
      return supabaseClient;
    }

    function getCredentials() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        throw new Error("Please enter both email and password.");
      }
      if (password.length < 6) {
        throw new Error("Password must contain at least 6 characters.");
      }
      return { email, password };
    }

    document.getElementById("signupBtn").addEventListener("click", async () => {
      try {
        showMessage("Creating your account...");
        const client = getClient();
        const { email, password } = getCredentials();

        const { data, error } = await client.auth.signUp({ email, password });
        if (error) throw error;

        if (data.session && data.user) {
          setLoggedIn(data.user);
        } else {
          showMessage(
            "Account created. Please check your email and confirm your account before logging in."
          );
        }
      } catch (error) {
        showMessage(error.message || "Could not create account.", true);
      }
    });

    document.getElementById("loginBtn").addEventListener("click", async () => {
      try {
        showMessage("Logging in...");
        const client = getClient();
        const { email, password } = getCredentials();

        const { data, error } = await client.auth.signInWithPassword({
          email, password
        });
        if (error) throw error;

        setLoggedIn(data.user);
      } catch (error) {
        showMessage(error.message || "Login failed.", true);
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      try {
        const client = getClient();
        const { error } = await client.auth.signOut();
        if (error) throw error;
        setLoggedOut();
        showMessage("You have logged out.");
      } catch (error) {
        showMessage(error.message || "Logout failed.", true);
      }
    });

    (async function restoreSession() {
      try {
        const client = getClient();
        const { data, error } = await client.auth.getSession();
        if (error) throw error;

        if (data.session && data.session.user) {
          setLoggedIn(data.session.user);
        }
      } catch (error) {
        showMessage(error.message || "Unable to initialize login.", true);
      }
    })();
  </script>
</body>
</html>
