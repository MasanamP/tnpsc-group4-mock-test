
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TNPSC Group 4 - Student Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }
    .card {
      max-width: 430px;
      margin: 50px auto;
      padding: 26px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 5px 24px #00000012;
    }
    h1 { font-size: 24px; text-align: center; }
    p { line-height: 1.5; color: #475569; }
    label { display: block; margin: 18px 0 7px; font-weight: bold; }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 13px;
      margin-top: 14px;
      border: 0;
      border-radius: 7px;
      background: #155eef;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    .secondary { background: #475569; }
    #message { overflow-wrap: anywhere; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main class="card">
    <h1>TNPSC Group 4</h1>
    <p style="text-align:center">Student Login / மாணவர் உள்நுழைவு</p>

    <section id="loginSection">
      <label for="phone">Mobile Number / மொபைல் எண்</label>
      <input
        id="phone"
        type="tel"
        autocomplete="tel"
        placeholder="+91 9876543210"
        maxlength="16"
      >
      <p>Enter your number with country code. India: +91.</p>
      <button id="sendButton" type="button">Send OTP</button>

      <div id="otpSection" class="hidden">
        <label for="otp">Enter OTP / OTP உள்ளிடவும்</label>
        <input
          id="otp"
          type="text"
          inputmode="numeric"
          autocomplete="one-time-code"
          placeholder="6-digit OTP"
          maxlength="6"
        >
        <button id="verifyButton" type="button">Verify OTP & Login</button>
        <button id="resendButton" class="secondary" type="button">
          Resend OTP
        </button>
      </div>
    </section>

    <section id="dashboard" class="hidden">
      <h2>Login Successful!</h2>
      <p id="studentInfo"></p>
      <p>Your student account is signed in.</p>
      <button id="logoutButton" class="secondary" type="button">
        Logout
      </button>
    </section>

    <p id="message" role="status" aria-live="polite"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Replace these with your existing Supabase project details.
    const SUPABASE_URL = "https://ghxdslzwiizjreuosuia.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY_HERE";

    const supabase = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const $ = (id) => document.getElementById(id);

    let currentPhone = "";

    function showMessage(message, isError = false) {
      $("message").textContent = message;
      $("message").style.color = isError ? "#b42318" : "#067647";
    }

    function setBusy(button, busy, label) {
      button.disabled = busy;
      if (busy) {
        button.dataset.originalText = button.textContent;
        button.textContent = label;
      } else {
        button.textContent =
          button.dataset.originalText || button.textContent;
      }
    }

    function normalizePhone(value) {
      // Remove spaces, brackets and hyphens; retain the leading +.
      return value.trim().replace(/[\s()-]/g, "");
    }

    async function sendOTP() {
      const button = $("sendButton");
      const phone = normalizePhone($("phone").value);

      // E.164 format: + followed by 8–15 digits.
      if (!/^\+[1-9]\d{7,14}$/.test(phone)) {
        showMessage(
          "Enter a valid phone number with country code, e.g. +919876543210.",
          true
        );
        return;
      }

      setBusy(button, true, "Sending...");
      showMessage("");

      try {
        const { error } = await supabase.auth.signInWithOtp({
          phone: phone
        });

        if (error) throw error;

        currentPhone = phone;
        $("otpSection").classList.remove("hidden");
        showMessage("OTP request sent. Check your SMS messages.");
        $("otp").focus();
      } catch (error) {
        showMessage(error.message || "Unable to send OTP.", true);
      } finally {
        setBusy(button, false);
      }
    }

    async function verifyOTP() {
      const button = $("verifyButton");
      const token = $("otp").value.trim();

      if (!currentPhone) {
        showMessage("Please request an OTP first.", true);
        return;
      }

      if (!/^\d{4,8}$/.test(token)) {
        showMessage("Enter the OTP received by SMS.", true);
        return;
      }

      setBusy(button, true, "Verifying...");
      showMessage("");

      try {
        const { data, error } = await supabase.auth.verifyOtp({
          phone: currentPhone,
          token: token,
          type: "sms"
        });

        if (error) throw error;

        $("loginSection").classList.add("hidden");
        $("dashboard").classList.remove("hidden");
        $("studentInfo").textContent =
          "Logged in mobile: " + (data.user?.phone || currentPhone);

        showMessage("Mobile number verified successfully.");
      } catch (error) {
        showMessage(error.message || "OTP verification failed.", true);
      } finally {
        setBusy(button, false);
      }
    }

    async function logout() {
      const { error } = await supabase.auth.signOut();

      if (error) {
        showMessage(error.message, true);
        return;
      }

      $("dashboard").classList.add("hidden");
      $("loginSection").classList.remove("hidden");
      $("otpSection").classList.add("hidden");
      $("otp").value = "";
      currentPhone = "";
      showMessage("You have logged out.");
    }

    $("sendButton").addEventListener("click", sendOTP);
    $("verifyButton").addEventListener("click", verifyOTP);
    $("resendButton").addEventListener("click", sendOTP);
    $("logoutButton").addEventListener("click", logout);

    // Restore an existing login when the page is reopened.
    async function restoreSession() {
      const { data, error } = await supabase.auth.getSession();

      if (error) {
        showMessage(error.message, true);
        return;
      }

      if (data.session) {
        $("loginSection").classList.add("hidden");
        $("dashboard").classList.remove("hidden");
        $("studentInfo").textContent =
          "Logged in mobile: " +
          (data.session.user.phone || "Verified account");
      }
    }

    restoreSession();
  </script>
</body>
</html>
